server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Asset filenames carry a content hash, so a given URL is immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The shell must never be cached: a stale index.html keeps pointing at asset
    # hashes that no longer exist after a deploy, and the app fails to boot.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Client-side routing: there is no file on disk for /login or /programs, so any
    # path that is not a real file falls back to the shell and React Router resolves it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
